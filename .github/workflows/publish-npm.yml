# Publish the package to npm from GitHub Actions using trusted publishing (OIDC).
#
# There is no NPM_TOKEN here: npm accepts this workflow because the package's
# Trusted Publisher setting names it, and GitHub mints a short-lived, run-scoped
# OIDC token instead. Provenance attestations are generated automatically for a
# public package from a public repository.
#
# Settings on npm's side (package → Settings → Trusted Publisher). These fields
# are fixed once created: to change one, delete the connection and add another.
#   publisher      GitHub Actions
#   organization   dan-ai-studio
#   repository     dshopencodego
#   workflow       publish-npm.yml      (exact filename, case-sensitive)
#   environment    (empty)
#   allowed        npm publish          (stage-only would require manual 2FA approval)
#
# Requirements in this file:
#   permissions.id-token: write         lets the runner request the OIDC token
#   npm >= 11.5.1, node >= 22.14        trusted publishing needs a recent npm;
#                                       Node 24 ships a new enough one
#
# Run from the Actions tab, or:
#   gh workflow run publish-npm --repo dan-ai-studio/dshopencodego -f tag=v<version>
# The tag must equal v<package.json version>, and that version must not exist on
# npm yet (registry versions are immutable).

name: publish-npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish (must equal v<package.json version>)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write # OIDC token for trusted publishing and provenance

# Two publishes must never overlap, and neither may be cancelled after the
# registry has accepted a version (registry versions are immutable).
concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # never cache in release builds
      - run: npm ci
      # Explicit rather than a side effect of `prepare` during `npm ci`: a
      # tarball with no `lib/` cannot be caught by anything downstream (npm
      # packs whatever exists), and `npm publish` has no undo.
      - run: npm run build
      # Static checks first: they are the fastest way to fail, and a release
      # should not spend minutes on the suite to then die on a lint error.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: The tag must match the packaged version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "${{ inputs.tag }}" ]; then
            echo "::error::tag ${{ inputs.tag }} does not match package version v$version"
            exit 1
          fi
      - name: Refuse to overwrite an existing version
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "@dan-ai-studio/dshopencodego@$version" version >/dev/null 2>&1; then
            echo "::error::@dan-ai-studio/dshopencodego@$version already exists on npm"
            exit 1
          fi
      # OIDC authentication is detected automatically, and --provenance is implied.
      - run: npm publish --access public
      # `npm publish` exiting 0 is not proof the version is installable: the
      # release is only real once the registry serves it. `npm view` is a
      # read-only query and needs no token, so it works under trusted
      # publishing. The registry can lag a publish by a few seconds, hence the
      # retries; never appearing is a failed release.
      - name: The registry must serve the version just published
        run: |
          version="$(node -p "require('./package.json').version")"
          for attempt in 1 2 3 4 5; do
            published="$(npm view "@dan-ai-studio/dshopencodego@$version" version 2>/dev/null || true)"
            if [ "$published" = "$version" ]; then
              echo "registry serves @dan-ai-studio/dshopencodego@$published"
              exit 0
            fi
            echo "attempt $attempt/5: registry returned '${published:-<nothing>}' for $version; retrying in 10s"
            sleep 10
          done
          echo "::error::@dan-ai-studio/dshopencodego@$version is not served by the registry after publish"
          exit 1
