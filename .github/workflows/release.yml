name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

# A release is never cancelled midway: the tag is already public, and a
# half-written GitHub Release is worse than a slow one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      # This workflow creates the *public* GitHub Release, and it used to run
      # the weakest gate of the three chains: `npm test` (no coverage floor),
      # no lint, no typecheck. It now runs the same gate as ci.yml, in the same
      # order, with the build made explicit rather than hidden inside the
      # install step's `prepare`.
      - run: npm run build
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm pack
      - name: Publish the tarball as the release asset
        env:
          GH_TOKEN: ${{ github.token }}
        # The description comes from CHANGELOG.md rather than
        # `--generate-notes`, which produced nothing but a compare link: a
        # release page told a reader nothing about what changed even though the
        # changelog beside it did. `release-notes.mjs` exits non-zero when the
        # section is missing, so a release cannot ship an empty description.
        #
        # Idempotent: a release created by hand for the same tag is completed
        # with the freshly built tarball instead of failing the run — and gets
        # the same description.
        run: |
          node scripts/release-notes.mjs > release-notes.md
          cat release-notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./*.tgz --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" ./*.tgz --notes-file release-notes.md
          fi
