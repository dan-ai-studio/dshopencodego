name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # `prepare` builds the bundle, so a broken build fails the install step.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm pack
